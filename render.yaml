services:
  - type: web
    name: internet-gratis
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # OBRIGATÓRIO no Render: cole sua connection string do Atlas. Sem isso o backend cai em memória volátil e APAGA logins a cada restart.
      - key: JWT_SECRET
        generateValue: true # gerado 1x no primeiro deploy e mantido — NÃO troque depois (troca desloga todo mundo).
      - key: ENCRYPTION_KEY
        generateValue: true # 64 hex gerado 1x — NÃO troque depois (invalida segredos do robô).
      - key: ADS_DAILY_CAP
        value: 20
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: ADMOB_APP_ID
        sync: false
      - key: FRONTEND_URL
        sync: false # ex: https://internet-gratis.onrender.com
      - key: ROBOT_ENABLED
        value: true
      - key: ROBOT_MESSAGES_PER_CREDIT
        value: 5
      - key: ROBOT_SESSION_BONUS_MINUTES
        value: 5
      - key: ROBOT_SESSION_IDLE_MINUTES
        value: 15
      - key: ROBOT_CREDITS_DAILY_CAP
        value: 3
      - key: ROBOT_HISTORY_MESSAGES
        value: 20
      - key: ROBOT_MAX_MESSAGE_CHARS
        value: 2000
      - key: ROBOT_XP_PER_LEVEL
        value: 10
      - key: USER_DB_CACHE_TTL_MINUTES
        value: 30
      - key: USER_DB_TEST_TIMEOUT
        value: 5000

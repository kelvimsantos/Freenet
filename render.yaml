services:
  - type: web
    name: internet-gratis
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://codemaster:codemaster@cluster0.vqzke.mongodb.net/internet_gratis?retryWrites=true&w=majority
      - key: JWT_SECRET
        value: 9f4c2a7e1b5d8f03a6c9e2b74d1f8a05c3e7b9d2a4f6c8e1b5d3a7f9c2e40681
      - key: ENCRYPTION_KEY
        value: 3a7f9c1e5b2d8f04a6c9e2b74d1f8a05c7e3b9d2a4f6c8e1b5d3a7f9c2e40d5e8
      - key: ADS_DAILY_CAP
        value: 20
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: ADMOB_APP_ID
        sync: false
      - key: FRONTEND_URL
        sync: false # ex: https://internet-gratis.onrender.com
      - key: ROBOT_ENABLED
        value: true
      - key: ROBOT_MESSAGES_PER_CREDIT
        value: 5
      - key: ROBOT_SESSION_BONUS_MINUTES
        value: 5
      - key: ROBOT_SESSION_IDLE_MINUTES
        value: 15
      - key: ROBOT_CREDITS_DAILY_CAP
        value: 3
      - key: ROBOT_HISTORY_MESSAGES
        value: 20
      - key: ROBOT_MAX_MESSAGE_CHARS
        value: 2000
      - key: ROBOT_XP_PER_LEVEL
        value: 10
      - key: USER_DB_CACHE_TTL_MINUTES
        value: 30
      - key: USER_DB_TEST_TIMEOUT
        value: 5000
